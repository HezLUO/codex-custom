name: Build platform candidates
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target to build; all runs the four new platforms
        type: choice
        required: true
        default: all
        options:
          - all
          - x86_64-apple-darwin
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
      reuse_reviewed_rust_tests:
        description: Reuse reviewed native tests only for unchanged, fingerprint-bound Rust inputs
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: platform-candidates-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: false
jobs:
  candidate:
    # Public candidate artifacts require review; uploading does not create a Release.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON((inputs.target == '' || inputs.target == 'all') && '["x86_64-apple-darwin","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","x86_64-pc-windows-msvc"]' || format('["{0}"]', inputs.target)) }}
    runs-on: ${{ fromJSON('{"x86_64-apple-darwin":"macos-15-intel","x86_64-unknown-linux-musl":"ubuntu-24.04","aarch64-unknown-linux-musl":"ubuntu-24.04-arm","x86_64-pc-windows-msvc":"windows-2022"}')[matrix.target] }}
    timeout-minutes: 360
    env:
      TARGET: ${{ matrix.target }}
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 6aaac694803004a63c6f393d153c96d22521a6b9
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable command-boundary checks
        run: |
          openssl version
          python scripts/sync-bootstraps.py --check
          python -m unittest discover -s tests -p test_platform_support.py
          python -m unittest discover -s tests -p test_platform_build.py
      - name: Prepare verified official resources and build inputs
        run: python scripts/build-platform.py prepare --source upstream --work "$RUNNER_TEMP/custom-build"
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rust-docs
          rustup target add --toolchain 1.99.1 "$TARGET"
      - name: Linux native MUSL tools
        if: runner.os == 'Linux'
        run: bash upstream/.github/scripts/install-musl-build-tools.sh
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./upstream/.github/actions/setup-msvc-env/setup-msvc-env.ps1 -Target $env:TARGET
      - name: Build and prepare reviewable candidate
        run: python scripts/build-platform.py build --source upstream --work "$RUNNER_TEMP/custom-build" --output dist ${{ inputs.reuse_reviewed_rust_tests && '--reuse-reviewed-tests' || '' }}
      - name: Linux disposable runner sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Native isolated install and uninstall
        run: python scripts/accept-platform.py --archive dist/codex-custom.tar.gz --official "$CODEX_CUSTOM_CI_OFFICIAL" --output dist/acceptance.json
      - name: Keep successful native candidates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.target }}
          path: |
            dist/codex-custom.tar.gz
            dist/codex-custom.tar.gz.sha256
            dist/release.json
            dist/license-review.json
            dist/acceptance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep incomplete source-review diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: review-needed-${{ matrix.target }}
          path: |
            dist/license-review.json
            dist/acceptance.json
            dist/privacy-review.json
            dist/privacy-details.cms
          if-no-files-found: ignore
          retention-days: 7
